<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guest WiFi</title>
<style>
  :root {
    --ink: #0B3D3B;
    --card: #0F4A47;
    --sand: #F5EFE3;
    --gold: #E3A857;
    --muted: #8FBBB4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--sand);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border-radius: 20px;
    padding: 36px 28px 28px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 6px;
    font-weight: 600;
  }
  .business {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 28px;
    color: var(--sand);
  }
  .label {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 4px;
  }
  .network {
    font-family: Georgia, "Iowan Old Style", serif;
    font-style: italic;
    font-size: 28px;
    margin: 0 0 24px;
    color: var(--sand);
    word-break: break-word;
  }
  .pass-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(245,239,227,0.08);
    border: 1px solid rgba(245,239,227,0.15);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 22px;
  }
  .pass-text {
    font-size: 18px;
    letter-spacing: 0.5px;
    font-weight: 600;
    flex: 1;
    word-break: break-all;
  }
  button.copy-btn {
    background: var(--gold);
    color: var(--ink);
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  button.copy-btn:active { transform: scale(0.97); }
  .note {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
    line-height: 1.5;
  }
  .wave {
    position: absolute;
    left: 0; right: 0; bottom: -2px;
    height: 46px;
    opacity: 0.5;
  }
  @media (prefers-reduced-motion: no-preference) {
    .wave path { animation: drift 9s ease-in-out infinite alternate; }
  }
  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(-14px); }
  }
</style>
</head>
<body>

  <div class="card">
    <p class="eyebrow">Guest WiFi</p>
    <!-- EDIT: business name -->
    <p class="business">Ocean View Guesthouse</p>

    <p class="label">Network</p>
    <!-- EDIT: network name (SSID) -->
    <p class="network">OceanView_Guest</p>

    <p class="label">Password</p>
    <div class="pass-row">
      <!-- EDIT: password (keep id="pw" on the span) -->
      <span class="pass-text" id="pw">welcome2026</span>
      <button class="copy-btn" onclick="copyPass()">Copy</button>
    </div>

    <!-- EDIT: footer note -->
    <p class="note">Trouble connecting? Ask at reception and we'll help you get set up.</p>

    <!-- EDIT: replace href with your Google review link (Business Profile > Ask for reviews > Share review form) -->
    <a href="https://g.page/r/REPLACE_WITH_YOUR_ID/review" target="_blank" rel="noopener" style="display:block;text-align:center;margin-top:22px;padding:12px;border-radius:10px;border:1px solid rgba(245,239,227,0.25);color:var(--sand);text-decoration:none;font-size:13px;font-weight:600;">
      Enjoying your stay? Leave us a review →
    </a>

    <svg class="wave" viewBox="0 0 400 46" preserveAspectRatio="none">
      <path d="M0,20 C60,40 100,0 160,20 C220,40 260,0 320,20 C350,30 380,15 400,20 L400,46 L0,46 Z"
            fill="#E3A857" opacity="0.35"/>
    </svg>
  </div>

<script>
function copyPass() {
  const text = document.getElementById('pw').innerText;
  const btn = document.querySelector('.copy-btn');
  function done() {
    const original = btn.innerText;
    btn.innerText = 'Copied!';
    setTimeout(() => { btn.innerText = original; }, 1500);
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(done);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    done();
  }
}
</script>

</body>
</html>
