<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<style>
  :root {
    --bg: #1C2023; --panel: #23282B; --ink: #F2EDE4; --muted: #9AA0A0;
    --copper: #C97D3D; --teal: #4C7B74;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card { width: 100%; max-width: 380px; text-align: center; }
  .eyebrow { font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  /* EDIT: business name */
  h1 { font-family: Georgia, "Iowan Old Style", serif; font-style: italic; font-weight: 400; font-size: 26px; margin: 0 0 34px; }
  .option {
    display: flex; align-items: center; gap: 14px; background: var(--panel);
    border: 1px solid rgba(242,237,228,0.1); border-radius: 14px; padding: 18px 20px;
    margin-bottom: 14px; text-decoration: none; color: var(--ink); text-align: left;
  }
  .option .icon { flex-shrink: 0; }
  .option .label { font-size: 16px; font-weight: 600; margin: 0 0 2px; }
  .option .desc { font-size: 12.5px; color: var(--muted); margin: 0; }
  .option .arrow { margin-left: auto; color: var(--muted); font-size: 18px; }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Welcome</p>
    <!-- EDIT: business name -->
    <h1>Ocean View Guesthouse</h1>

    <!-- EDIT: link to your hosted WiFi page -->
    <a class="option" href="wifi-guest-page.html">
      <span class="icon">
        <svg width="26" height="26" viewBox="0 0 24 24">
          <path d="M4 9 A 12 12 0 0 1 20 9" stroke="#C97D3D" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <path d="M7.5 13 A 7 7 0 0 1 16.5 13" stroke="#C97D3D" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <circle cx="12" cy="17.5" r="2" fill="#C97D3D"/>
        </svg>
      </span>
      <span>
        <p class="label">Guest WiFi</p>
        <p class="desc">Get the network name and password</p>
      </span>
      <span class="arrow">›</span>
    </a>

    <!-- EDIT: replace with your Google review share link -->
    <a class="option" href="https://g.page/r/REPLACE_WITH_YOUR_ID/review" target="_blank" rel="noopener">
      <span class="icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#C97D3D">
          <path d="M12 2 L14.6 8.5 L21.5 9 L16.2 13.4 L18 20.2 L12 16.3 L6 20.2 L7.8 13.4 L2.5 9 L9.4 8.5 Z"/>
        </svg>
      </span>
      <span>
        <p class="label">Leave a Review</p>
        <p class="desc">Tell us how your stay was</p>
      </span>
      <span class="arrow">›</span>
    </a>

    <!-- EDIT: link to your hosted house info page -->
    <a class="option" href="guesttap-houseinfo.html">
      <span class="icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C97D3D" stroke-width="2">
          <path d="M4 11 L12 4 L20 11" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 10 V20 H18 V10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span>
        <p class="label">House Info &amp; Check-out</p>
        <p class="desc">Rules, times, and anything else you need</p>
      </span>
      <span class="arrow">›</span>
    </a>
  </div>
</body>
</html>
